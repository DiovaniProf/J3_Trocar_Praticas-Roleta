<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04132d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Roleta interativa para compartilhar experiências e ampliar possibilidades.">
  <title>Compartilhar experiências, ampliar possibilidades.</title>
  <link rel="preload" href="ILHA7.jpg" as="image">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="experience">
    <button class="fullscreen-toggle" type="button" id="fullscreenButton" aria-label="Ativar tela cheia" title="Tela cheia (F11 no computador)">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <!-- O título faz parte de ILHA7.jpg e é reproduzido apenas em telas pequenas. -->
    <h1 class="visually-hidden">Compartilhar experiências, ampliar possibilidades.</h1>

    <section class="workspace" aria-label="Roleta de participantes">
      <div class="wheel-area">
        <div class="wheel-light" aria-hidden="true"></div>
        <div class="wheel-rotor" id="wheelRotor">
          <canvas id="wheelCanvas" width="900" height="900" role="img"
                  aria-label="Roleta com dez participantes. Keli, Cristiane e Dijalmary com estrela; Tiago, Rosemeri e Andreia com lua; Edenilse, Ilse, Liliana e Mariane com sol. Todos os nomes são lidos de fora para dentro."></canvas>
        </div>
        <div class="wheel-pointer" aria-hidden="true">
          <svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="p-metal" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset=".28" stop-color="#9ddaff"/>
                <stop offset=".60" stop-color="#316aab"/>
                <stop offset="1" stop-color="#edfaff"/>
              </linearGradient>
            </defs>
            <path d="M4 4H60L32 74Z" fill="url(#p-metal)" stroke="#ddf9ff" stroke-width="3"/>
            <path d="M14 12H50L32 56Z" fill="#c7f4ff" opacity=".24"/>
          </svg>
        </div>
        <div class="wheel-hub" aria-hidden="true"><span></span></div>
      </div>

      <div class="control-panel">
        <div class="action-row">
          <button type="button" class="spin-button" id="spinButton">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 4v5h5M18 20v-5h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7.2 16.9A8 8 0 0 0 20 12M4 12A8 8 0 0 1 16.8 7.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            <span id="spinButtonText">GIRAR ROLETA</span>
          </button>
          <button type="button" class="icon-button" id="settingsButton" aria-label="Abrir opções" aria-expanded="false" aria-controls="settingsPanel" title="Opções da roleta">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="2.3" fill="#a5edff"/><circle cx="15" cy="17" r="2.3" fill="#a5edff"/></svg>
          </button>
        </div>
        <div id="drawCounter" class="draw-counter" aria-live="polite">0 de 10 sorteados</div>
      </div>
      <aside class="settings-panel" id="settingsPanel" aria-label="Opções da roleta" hidden>
        <div class="settings-heading"><strong>Opções da roleta</strong><button type="button" id="closeSettingsButton" class="history-close" aria-label="Fechar opções">×</button></div>
        <label class="no-repeat-toggle">
          <input id="noRepeatToggle" type="checkbox" checked>
          <span class="switch" aria-hidden="true"></span>
          <span>Não repetir nomes</span>
        </label>
        <div class="settings-toolbar">
          <button type="button" class="secondary-button" id="historyButton" aria-label="Abrir histórico dos sorteios" aria-expanded="false" aria-controls="historyPanel" title="Histórico">Histórico</button>
          <button type="button" id="resetButton" class="secondary-button" title="Apagar o histórico e reiniciar todos os sorteios">Reiniciar</button>
        </div>
        <section class="history-panel" id="historyPanel" aria-label="Histórico dos sorteios" hidden>
          <div class="history-header"><strong>Histórico</strong><button type="button" class="history-close" id="closeHistoryButton" aria-label="Fechar histórico">×</button></div>
          <ol id="historyList" class="history-list"></ol>
          <p id="historyEmpty" class="history-empty">Nenhum nome sorteado ainda.</p>
        </section>
      </aside>
    </section>
  </main>

  <div class="result-overlay" id="resultOverlay" hidden>
    <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultHeading" aria-describedby="winnerName">
      <div class="result-icon" aria-hidden="true">✦</div>
      <p id="resultHeading" class="result-eyebrow">NOME SORTEADO</p>
      <p class="winner-name" id="winnerName"></p>
      <span id="winnerSymbol" class="winner-symbol" aria-hidden="true"></span>
      <p class="result-caption" id="resultCaption">Compartilhar é multiplicar possibilidades.</p>
      <button type="button" id="continueButton" class="continue-button">CONTINUAR</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
